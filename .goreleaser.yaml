# Binary-release config, run on the macOS runner (single goreleaser invocation).
# The darwin targets need cgo (the NWPathMonitor bridge) and build natively; the
# other targets cross-compile with CGO disabled. Container images are built and
# pushed separately by the release workflow's Linux job (goreleaser's `prebuilt`
# builder is PRO-only, so it is not used here).
version: 2

project_name: wireguard-go

builds:
  - id: native
    main: .
    binary: wireguard-go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - freebsd
      - openbsd
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
  - id: darwin
    main: .
    binary: wireguard-go
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - id: default
    ids:
      - native
      - darwin
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"
