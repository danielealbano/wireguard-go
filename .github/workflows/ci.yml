name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-vet-test:
    name: lint, vet, test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
      - run: go test -race ./...
      - run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test-macos:
    name: build, test (macos, cgo)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - run: CGO_ENABLED=1 go build ./...
      - run: go test -race ./...

  build:
    name: build (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows, freebsd, openbsd]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - run: GOOS=${{ matrix.goos }} CGO_ENABLED=0 go build ./...

  build-android:
    name: build (android, library)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      # Android consumes this repo as a Go module (no standalone daemon; D18), so
      # compile-check the library packages. The root main package is excluded: an
      # android executable requires external cgo linking, which is out of scope here.
      - run: |
          pkgs=$(go list ./... | grep -v '^golang.zx2c4.com/wireguard$')
          for arch in arm64 arm amd64; do
            GOOS=android GOARCH=$arch CGO_ENABLED=0 go build $pkgs
          done

  e2e:
    name: e2e (linux netns)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - name: Install wstunnel (pinned + checksum)
        run: |
          cd "$(mktemp -d)"
          url=https://github.com/erebe/wstunnel/releases/download/v10.6.2/wstunnel_10.6.2_linux_amd64.tar.gz
          curl -fsSL "$url" -o wstunnel.tgz
          echo "db6064cca0515b67f8652e201cff8e27553b8cbb7216b2e19241311e34868e6e  wstunnel.tgz" | sha256sum -c -
          tar xzf wstunnel.tgz
          sudo install -m 0755 wstunnel /usr/local/bin/wstunnel
          echo "WSTUNNEL_BIN=/usr/local/bin/wstunnel" >> "$GITHUB_ENV"
      - run: make test-e2e

  mermaid:
    name: mermaid (docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: ./scripts/mermaid-check.sh docs
