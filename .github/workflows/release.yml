name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # All binaries (darwin needs cgo, so they build natively on a macOS runner; the
  # other targets cross-compile with CGO disabled) plus archives, checksums, and
  # the GitHub release, in a single goreleaser run.
  binaries:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The multi-arch container image, built and pushed on Linux (buildx). Runs in
  # parallel with the binaries job; it does not depend on goreleaser artifacts.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.2.0
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/danielealbano/wireguard-go:${{ github.ref_name }}
            ghcr.io/danielealbano/wireguard-go:latest
